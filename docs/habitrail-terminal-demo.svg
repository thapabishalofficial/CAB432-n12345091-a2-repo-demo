<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="560" height="340" rx="10" fill="#151815"/>
<rect width="560" height="34" rx="10" fill="#232823"/>
<rect y="24" width="560" height="10" fill="#232823"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/>
<circle cx="42" cy="17" r="6" fill="#febc2e"/>
<circle cx="62" cy="17" r="6" fill="#28c840"/>
<text x="280" y="21" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8a9088">habitrail — zsh</text>

<g font-family="Menlo, Consolas, monospace" font-size="14" fill="#d7dcd7">
<text x="20" y="66"><tspan fill="#4ade80">$</tspan> habitrail status</text>
<text x="20" y="94" fill="#8a9088">Habit: read 20 pages</text>
<text x="20" y="118">Mon <tspan fill="#4ade80">✓</tspan>  Tue <tspan fill="#4ade80">✓</tspan>  Wed <tspan fill="#4ade80">✓</tspan>  Thu <tspan fill="#4ade80">✓</tspan>  Fri <tspan fill="#4ade80">✓</tspan>  Sat <tspan fill="#5a5f5a">·</tspan>  Sun <tspan fill="#5a5f5a">·</tspan></text>
<text x="20" y="148" fill="#facc15">Current streak: 5 days</text>
<text x="20" y="168" fill="#8a9088">Longest streak: 12 days</text>

<text x="20" y="206"><tspan fill="#4ade80">$</tspan> habitrail log --habit "read 20 pages" --note "finished ch. 4"</text>
<text x="20" y="230" fill="#8a9088">Logged for 2026-09-25. Streak now 6 days.</text>

<text x="20" y="268"><tspan fill="#4ade80">$</tspan> habitrail edit --date 2026-09-22 --note "typo fix"</text>
<text x="20" y="292" fill="#ff6b6b">⚠ streak recalculated: 0 days (see issue #12)</text>
<text x="20" y="314" fill="#8a9088">$ <tspan fill="#d7dcd7" style="opacity:0.6">▍</tspan></text>
